# Local test stack: the app, a PostgreSQL standing in for the external database,
# and a Keycloak acting as the OpenID Connect provider (realm: dev/keycloak/).
# In Kubernetes the database and the identity provider are external; nothing
# here is deployed there. All credentials below are LOCAL DEVELOPMENT values.
#
# Keycloak is reached as http://keycloak.localhost:8081 both by your browser
# (*.localhost resolves to 127.0.0.1) and by the app container (network alias),
# so the token issuer URL is identical from both sides.
services:
  postgres:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    environment:
      POSTGRES_DB: dmarc
      POSTGRES_USER: dmarc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmarc-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmarc -d dmarc"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8@sha256:7e66a96e4739239070aeaf72e4c5decf0f7f682cfc725b9f7ea2b336eaba38b3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme-admin}
      KC_HTTP_PORT: "8081"
      KC_HOSTNAME: http://keycloak.localhost:8081
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      default:
        aliases: [keycloak.localhost]
    healthcheck:
      # No curl in the image: speak HTTP to the management port with bash.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  app:
    build:
      context: .
      args:
        VERSION: 2.0.0
    image: dmarc-analysis:2.0.0
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      PORT: "8080"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: dmarc
      PGUSER: dmarc
      PGPASSWORD: ${POSTGRES_PASSWORD:-dmarc-local-only}
      PGSSLMODE: disable
      # Alternatively: DATABASE_URL: postgres://dmarc:...@postgres:5432/dmarc?sslmode=disable
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_THRESHOLD: "0.10"
      # Authentication (OpenID Connect)
      APP_BASE_URL: http://localhost:8080
      OIDC_ISSUER_URL: http://keycloak.localhost:8081/realms/dmarc
      OIDC_CLIENT_ID: dmarc-analysis
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-local-dev-changeme-client-secret}
      OIDC_REQUIRED_ROLE: dmarc-viewer
      SESSION_SECRET: ${SESSION_SECRET:-local-dev-changeme-session-secret-0123456789}
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
