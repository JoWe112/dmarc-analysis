# Local test stack: the app + a PostgreSQL instance standing in for the external database.
# In Kubernetes the database is external; nothing here is deployed there.
services:
  postgres:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    environment:
      POSTGRES_DB: dmarc
      POSTGRES_USER: dmarc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dmarc-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmarc -d dmarc"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      args:
        VERSION: 1.0.0
    image: dmarc-analysis:1.0.0
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: dmarc
      PGUSER: dmarc
      PGPASSWORD: ${POSTGRES_PASSWORD:-dmarc-local-only}
      PGSSLMODE: disable
      # Alternatively: DATABASE_URL: postgres://dmarc:...@postgres:5432/dmarc?sslmode=disable
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_THRESHOLD: "0.10"
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
