# EXAMPLE ONLY – do not commit real values. Prefer creating the Secret out-of-band:
#   kubectl create secret generic dmarc-analysis-secret \
#     --from-literal=PGUSER=dmarc --from-literal=PGPASSWORD='...' \
#     --from-literal=OIDC_CLIENT_SECRET='...' \
#     --from-literal=SESSION_SECRET="$(openssl rand -base64 48)" \
#     --from-literal=ALERT_WEBHOOK_URL='https://hooks.example.com/...'
# or manage it with Sealed Secrets / External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: dmarc-analysis-secret
  labels:
    app.kubernetes.io/name: dmarc-analysis
type: Opaque
stringData:
  PGUSER: "dmarc"
  PGPASSWORD: "changeme-placeholder"
  # Confidential client secret registered at the OIDC provider.
  OIDC_CLIENT_SECRET: "changeme-placeholder"
  # Encrypts session cookies; >= 32 random characters. Rotating it logs everyone out.
  SESSION_SECRET: "changeme-placeholder-use-openssl-rand-base64-48"
  # Optional. Leave empty to disable alerting.
  ALERT_WEBHOOK_URL: ""
  # Optional alternative to the PG* variables (takes precedence when set):
  # DATABASE_URL: "postgres://dmarc:changeme-placeholder@postgres.database.svc:5432/dmarc?sslmode=require"
