# Option A: classic Ingress. Use EITHER this OR httproute.yaml.
# Authentication is handled by the application itself (OIDC). The host here
# must match APP_BASE_URL in the ConfigMap, and TLS must terminate here so
# session cookies are marked Secure.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dmarc-analysis
  labels:
    app.kubernetes.io/name: dmarc-analysis
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [dmarc.example.com]
      secretName: dmarc-analysis-tls   # example: name of your TLS Secret (cert-manager etc.)
  rules:
    - host: dmarc.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dmarc-analysis
                port:
                  name: http
