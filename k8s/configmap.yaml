apiVersion: v1
kind: ConfigMap
metadata:
  name: dmarc-analysis-config
  labels:
    app.kubernetes.io/name: dmarc-analysis
data:
  # Non-sensitive settings only. Credentials live in the Secret.
  PORT: "8080"
  PGHOST: "postgres.database.svc.cluster.local"   # external PostgreSQL host
  PGPORT: "5432"
  PGDATABASE: "dmarc"
  PGSSLMODE: "require"                             # disable | require | verify-full
  PG_POOL_MAX: "10"
  ALERT_THRESHOLD: "0.10"                          # alert when > 10 % of new mail fails
  MAX_RECORDS: "5000"
  BODY_LIMIT: "20mb"

  # --- Authentication (OpenID Connect, handled by the application) ---
  APP_BASE_URL: "https://dmarc.example.com"        # public URL; redirect URI = APP_BASE_URL/auth/callback
  OIDC_ISSUER_URL: "https://sso.example.com/realms/example"
  OIDC_CLIENT_ID: "dmarc-analysis"
  OIDC_SCOPES: "openid profile email"
  OIDC_REQUIRED_ROLE: "dmarc-viewer"               # empty = any authenticated user
  OIDC_ROLE_CLAIM: "realm_access.roles"            # e.g. "groups" for group-based access
  SESSION_TTL_SECONDS: "28800"                     # 8 h
  # OIDC_AUDIENCE: "dmarc-api"                     # optional: require this `aud` on bearer tokens
