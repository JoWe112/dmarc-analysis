# Defence in depth: the application authenticates every request itself (OIDC),
# but the pods should still only be reachable through the ingress controller /
# gateway (plus kubelet probes, which are not subject to NetworkPolicy).
# Egress is not restricted: the pods need PostgreSQL, the OIDC provider and
# the alert webhook. Adjust the namespace labels to your cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dmarc-analysis
  labels:
    app.kubernetes.io/name: dmarc-analysis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dmarc-analysis
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx     # or your gateway namespace
        # OpenShift router:
        # - namespaceSelector:
        #     matchLabels:
        #       network.openshift.io/policy-group: ingress
      ports:
        - port: 8080
          protocol: TCP
